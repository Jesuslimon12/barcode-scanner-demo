<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden;font-family:Archivo,system-ui,sans-serif;background:#141414}
.feed{position:absolute;inset:0 0 196px;background:linear-gradient(160deg,#3a3f36,#22251f 60%,#151613);overflow:hidden}
.box{position:absolute;left:58px;top:250px;width:274px;height:150px;background:#d9cfb8;transform:rotate(-3deg);border-radius:4px}
.bars{position:absolute;left:96px;top:290px;width:200px;height:70px;transform:rotate(-3deg);background:repeating-linear-gradient(90deg,#111 0 3px,transparent 3px 5px,#111 5px 6px,transparent 6px 10px);filter:brightness(.55)}
.dim{position:absolute;inset:0;background:rgb(0 0 0/.5)}
.close{position:absolute;top:56px;right:16px;width:44px;height:44px;border-radius:50%;background:rgb(0 0 0/.55);display:grid;place-items:center}
.close svg{width:20px;stroke:#fff;stroke-width:2.5;stroke-linecap:round}
.strip{position:absolute;left:0;right:0;bottom:0;height:196px;background:#FFD60A;color:#141414;padding:16px 16px 24px;border-top:4px solid #141414}
.fill{position:absolute;left:0;top:-4px;height:4px;width:100%;background:#141414}
.lbl{font:700 11px/1 Archivo;font-stretch:110%;letter-spacing:.14em;text-transform:uppercase}
.tag{position:absolute;left:16px;right:16px;top:-120px;height:148px;background:#FAFAF7;border:2px solid #141414;box-shadow:0 6px 0 #141414;padding:14px 16px;display:grid;align-content:space-between}
.code{font:900 52px/0.95 Archivo;font-stretch:62%;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.code span{display:inline-block;margin-right:10px}
.row{display:flex;justify-content:space-between;align-items:end}
.small{font:500 13px/1.3 Archivo;color:#4a4a44}
.notch{position:absolute;top:-10px;left:50%;width:44px;height:10px;margin-left:-22px;background:#141414;border-radius:3px 3px 0 0}
.actions{position:absolute;left:16px;right:16px;bottom:24px;display:flex;gap:8px}
.btn{flex:1;height:52px;display:grid;place-items:center;font:800 15px Archivo;font-stretch:110%;letter-spacing:.06em;text-transform:uppercase}
.p{background:#141414;color:#FFD60A}.s{border:2px solid #141414}
</style></head><body>
<div class="feed"><div class="box"></div><div class="bars"></div><div class="dim"></div></div>
<div class="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
<div class="strip">
  <div class="fill"></div>
  <div class="tag">
    <div class="notch"></div>
    <div class="lbl">Scanned · EAN-13</div>
    <div class="code"><span>7</span><span>501055</span><span>300075</span></div>
    <div class="row"><div class="small">Held steady for 0.8 s</div><div class="lbl">Read OK</div></div>
  </div>
  <div class="actions"><div class="btn p">Use this code</div><div class="btn s">Scan again</div></div>
</div>
</body></html>
