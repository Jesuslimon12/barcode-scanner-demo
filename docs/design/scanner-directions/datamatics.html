<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden;background:#000;color:#fff;font-family:'JetBrains Mono',ui-monospace,monospace}
.feed{position:absolute;left:0;right:0;top:0;height:560px;background:linear-gradient(160deg,#555,#222);filter:grayscale(1)}
.frame{position:absolute;left:0;right:0;top:0;height:560px;box-shadow:inset 0 0 0 999px #000;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 0,39px 200px,39px 356px,351px 356px,351px 200px,39px 200px)}
.guide{position:absolute;left:39px;top:200px;width:312px;height:156px;outline:1px solid #fff}
.field{position:absolute;left:39px;top:372px;width:312px;height:28px;background:repeating-linear-gradient(90deg,#fff 0 1px,#000 1px 3px,#fff 3px 5px,#000 5px 9px)}
.field i{position:absolute;right:0;top:0;bottom:0;width:38%;background:#000;border-left:1px solid #fff}
.nums{position:absolute;left:16px;top:120px;font-size:10px;line-height:1.5;color:#fff;opacity:.6;letter-spacing:.08em}
.close{position:absolute;top:56px;right:16px;width:44px;height:44px;border:1px solid #fff;display:grid;place-items:center}
.close svg{width:18px;stroke:#fff;stroke-width:2}
.panel{position:absolute;left:0;right:0;bottom:0;height:284px;background:#fff;color:#000;padding:20px 16px}
.k{font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.code{font-size:34px;font-weight:700;margin:14px 0 6px;letter-spacing:.02em}
.bars{height:46px;background:repeating-linear-gradient(90deg,#000 0 2px,#fff 2px 4px,#000 4px 7px,#fff 7px 8px,#000 8px 9px,#fff 9px 13px)}
.btn{position:absolute;left:16px;right:16px;bottom:24px;height:52px;background:#000;color:#fff;display:grid;place-items:center;font-weight:700;letter-spacing:.14em}
</style></head><body>
<div class="feed"></div><div class="frame"></div><div class="guide"></div>
<div class="field"><i></i></div>
<div class="nums">0.62 · 1.00 · 0.62<br>EAN_13 · 95 MOD<br>LOCK 62%</div>
<div class="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
<div class="panel">
  <div class="k">Read · Inverted</div>
  <div class="code">7501055300075</div>
  <div class="bars"></div>
  <div class="btn">USE THIS CODE</div>
</div>
</body></html>
