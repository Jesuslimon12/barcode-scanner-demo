<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112,300..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden;background:#1b1b1a;font-family:'Martian Mono',ui-monospace,monospace}
.feed{position:absolute;inset:0 0 300px;background:linear-gradient(170deg,#4a4740,#262521)}
.guide{position:absolute;left:39px;top:180px;width:312px;height:156px;border:2px dashed rgb(244 241 234/.8)}
.close{position:absolute;top:56px;right:16px;width:44px;height:44px;border-radius:50%;background:rgb(0 0 0/.5);display:grid;place-items:center}
.close svg{width:20px;stroke:#fff;stroke-width:2.5;stroke-linecap:round}
.rcpt{position:absolute;left:24px;right:24px;bottom:0;height:330px;background:#F4F1EA;color:#2B2B2B;padding:22px 20px;font-size:12px;line-height:1.7}
.rcpt:before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px;background:linear-gradient(-45deg,#F4F1EA 4px,transparent 0) 0 0/8px 8px,linear-gradient(45deg,#F4F1EA 4px,transparent 0) 0 0/8px 8px}
.c{text-align:center;font-weight:700;letter-spacing:.2em}
.d{border-top:1px dashed #8A8A85;margin:10px 0}
.l{display:flex;justify-content:space-between;color:#8A8A85}
.code{font-size:26px;font-weight:700;font-stretch:75%;text-align:center;margin:8px 0;letter-spacing:.04em}
.btn{margin-top:14px;height:50px;background:#2B2B2B;color:#F4F1EA;display:grid;place-items:center;font-weight:700;letter-spacing:.12em}
</style></head><body>
<div class="feed"><div class="guide"></div></div>
<div class="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
<div class="rcpt">
  <div class="c">— SCAN —</div>
  <div class="d"></div>
  <div class="l"><span>FORMAT</span><span>EAN-13</span></div>
  <div class="l"><span>TIME</span><span>16:42:07</span></div>
  <div class="d"></div>
  <div class="code">7501055300075</div>
  <div class="d"></div>
  <div class="c" style="color:#8A8A85;font-weight:400">READ CONFIRMED</div>
  <div class="btn">USE THIS CODE</div>
</div>
</body></html>
